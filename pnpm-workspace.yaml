packages:
  - apps/*
  - packages/*
  - tools/*
  - prototypes/*

# Every dependency version lives here; a package.json refers to it as "catalog:".
catalog:
  "@better-auth/drizzle-adapter": 1.7.27
  "@better-auth/passkey": 1.7.27
  "@biomejs/biome": 2.6.7
  "@cfworker/json-schema": 4.1.6
  # 1.69.1, not the latest: 1.70.x needs a newer wrangler than the one below,
  # which apps/api deploys with.
  "@cloudflare/vite-plugin": 1.69.1
  "@hono/zod-openapi": 1.6.3
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.7
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  better-auth: 1.7.27
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  hono: 4.13.18
  knip: 6.45.1
  lefthook: 2.2.2
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  pg: 8.23.1
  react: 19.3.1
  react-dom: 19.3.1
  turbo: 2.11.11
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.0
  wrangler: 4.162.0
  zod: 4.6.7

# A second TypeScript, only for tools/openapi-typegen: openapi-typescript 7.13.0
# builds its output with the TypeScript 5 compiler API, which TypeScript 7
# doesn't ship. Every workspace still typechecks with the catalog's typescript.
# Remove it once openapi-typescript runs on TypeScript 7.
catalogs:
  typegen:
    typescript: 5.9.3

# Reviewed build scripts. lefthook's postinstall only runs `lefthook install`,
# which the root `prepare` script already does. esbuild's and workerd's check
# the native binary that pnpm already installs from their optional
# dependencies, and download it when that is missing.
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false

# A script or the pre-commit hook stops when node_modules is out of date,
# instead of installing and rewriting pnpm-lock.yaml unseen. Don't set this to
# install (pnpm's default): the lockfile changes only through an explicit
# `pnpm install`. Not warn either: the checks would run on stale dependencies.
verifyDepsBeforeRun: error
